name: build ⚙️

on: [ push, pull_request ]

jobs:
  main:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@master
    - uses: actions/setup-python@v5
      name: Setup Python ${{ matrix.python-version }}
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies 📦
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts debhelper-compat dh-python python3-all python3-build pybuild-plugin-pyproject python3-setuptools python3-tomli python3-wheel
    - name: Install package and dev requirements 📦
      run: |
        pip3 install .
        pip3 install ".[dev]"
        pip3 install ".[release]"
    - name: run tests ⚙️
      run: python3 tests/run_tests.py
    - name: build Python package 🏗️
      run: python3 -m build
    - name: build Debian package 🏗️
      run: sudo debuild -b -uc -us
